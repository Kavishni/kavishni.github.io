project:
  type: website
  # Render website pages, not repository instructions or design documents.
  render:
    - "*.qmd"

website:
  title: "Kavishni Nanayakkara"
  site-url: https://kavishni.github.io
  search: false
  navbar:
    background: light
    foreground: dark
    pinned: true
    right:
      - href: "#research"
        text: "&#91;Research&#93;"
      # Writing remains on Substack; other links jump to homepage sections.
      - text: "&#91;Writing&#93;"
        href: https://kavishni.substack.com/
      - href: "#about"
        text: "&#91;About&#93;"
  page-footer:
    border: false
    left: "Kavishni Nanayakkara · Economics Researcher"
    right:
      - text: "[Substack]"
        href: https://kavishni.substack.com/
      - text: "[GitHub]"
        href: https://github.com/Kavishni
      - text: "[LinkedIn]"
        href: https://www.linkedin.com/in/kavishni/

format:
  html:
    theme:
      - default
      - brand
    css: styles.css
    toc: false
    grid:
      body-width: 1200px
      sidebar-width: 0px
      margin-width: 0px
      gutter-width: 40px
